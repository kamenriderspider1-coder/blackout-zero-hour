name: Build BLACKOUT ZERO HOUR
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Install SDL2
        run: brew install sdl2
      - name: Build native macOS app
        run: |
          mkdir -p dist/BLACKOUT\ ZERO\ HOUR.app/Contents/MacOS
          mkdir -p dist/BLACKOUT\ ZERO\ HOUR.app/Contents/Resources
          SDL_CFLAGS="$(sdl2-config --cflags)"
          SDL_LIBS="$(sdl2-config --libs)"
          clang -O2 -Wall $SDL_CFLAGS macos/main.c $SDL_LIBS -o "dist/BLACKOUT ZERO HOUR.app/Contents/MacOS/blackout-zero-hour"
          cat > "dist/BLACKOUT ZERO HOUR.app/Contents/Info.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
          <key>CFBundleExecutable</key><string>blackout-zero-hour</string>
          <key>CFBundleIdentifier</key><string>com.blackoutzerohour.game</string>
          <key>CFBundleName</key><string>BLACKOUT ZERO HOUR</string>
          <key>CFBundlePackageType</key><string>APPL</string>
          <key>LSMinimumSystemVersion</key><string>12.0</string>
          <key>NSHighResolutionCapable</key><true/>
          </dict></plist>
          PLIST
          cp "$(brew --prefix sdl2)/lib/"*.dylib "dist/BLACKOUT ZERO HOUR.app/Contents/Frameworks/" 2>/dev/null || true
          ditto -c -k --sequesterRsrc --keepParent "dist/BLACKOUT ZERO HOUR.app" "BLACKOUT-ZERO-HOUR-macOS.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: BLACKOUT-ZERO-HOUR-macOS
          path: BLACKOUT-ZERO-HOUR-macOS.zip
          if-no-files-found: error
