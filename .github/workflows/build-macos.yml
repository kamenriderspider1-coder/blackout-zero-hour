name: Build BLACKOUT ZERO HOUR for macOS
on:
  push:
    branches: [main]
    paths:
      - 'macos/**'
      - '.github/workflows/build-macos.yml'
      - 'README.md'
  workflow_dispatch:
concurrency:
  group: blackout-zero-hour-macos-${{ github.ref }}
  cancel-in-progress: false
jobs:
  macos:
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install SDL2
        run: brew install sdl2
      - name: Compile application
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "dist/BLACKOUT ZERO HOUR.app/Contents/MacOS"
          mkdir -p "dist/BLACKOUT ZERO HOUR.app/Contents/Frameworks"
          SDL_PREFIX="$(brew --prefix sdl2)"
          clang -O2 -Wall -Wextra $(sdl2-config --cflags) macos/main.c macos/net_client.c $(sdl2-config --libs) -lm -o "dist/BLACKOUT ZERO HOUR.app/Contents/MacOS/blackout-zero-hour"
          cp "$SDL_PREFIX/lib/libSDL2-2.0.0.dylib" "dist/BLACKOUT ZERO HOUR.app/Contents/Frameworks/"
          install_name_tool -id "@executable_path/../Frameworks/libSDL2-2.0.0.dylib" "dist/BLACKOUT ZERO HOUR.app/Contents/Frameworks/libSDL2-2.0.0.dylib"
          install_name_tool -change "$SDL_PREFIX/lib/libSDL2-2.0.0.dylib" "@executable_path/../Frameworks/libSDL2-2.0.0.dylib" "dist/BLACKOUT ZERO HOUR.app/Contents/MacOS/blackout-zero-hour"
          cat > "dist/BLACKOUT ZERO HOUR.app/Contents/Info.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
          <key>CFBundleExecutable</key><string>blackout-zero-hour</string>
          <key>CFBundleIdentifier</key><string>com.blackoutzerohour.game</string>
          <key>CFBundleName</key><string>BLACKOUT ZERO HOUR</string>
          <key>CFBundlePackageType</key><string>APPL</string>
          <key>LSMinimumSystemVersion</key><string>12.0</string>
          <key>NSHighResolutionCapable</key><true/>
          </dict></plist>
          PLIST
          file "dist/BLACKOUT ZERO HOUR.app/Contents/MacOS/blackout-zero-hour"
          otool -L "dist/BLACKOUT ZERO HOUR.app/Contents/MacOS/blackout-zero-hour"
          ditto -c -k --sequesterRsrc --keepParent "dist/BLACKOUT ZERO HOUR.app" "BLACKOUT-ZERO-HOUR-macOS.zip"
      - name: Create DMG installer
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "dist/dmg"
          ditto "dist/BLACKOUT ZERO HOUR.app" "dist/dmg/BLACKOUT ZERO HOUR.app"
          ln -s /Applications "dist/dmg/Applications"
          hdiutil create -volname "BLACKOUT ZERO HOUR" -srcfolder "dist/dmg" -ov -format UDZO "BLACKOUT-ZERO-HOUR-macOS.dmg"
          hdiutil verify "BLACKOUT-ZERO-HOUR-macOS.dmg"
      - name: Upload downloadable DMG
        uses: actions/upload-artifact@v4
        with:
          name: BLACKOUT-ZERO-HOUR-macOS-DMG
          path: BLACKOUT-ZERO-HOUR-macOS.dmg
          if-no-files-found: error
          retention-days: 30
      - name: Upload downloadable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: BLACKOUT-ZERO-HOUR-macOS
          path: BLACKOUT-ZERO-HOUR-macOS.zip
          if-no-files-found: error
          retention-days: 30
