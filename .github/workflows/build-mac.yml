name: Build BLACKOUT ZERO HOUR for macOS

on:
  push:
    branches: [main]
    paths:
      - "macos/**"
      - ".github/workflows/build-mac.yml"
      - "README.md"
  workflow_dispatch:

permissions:
  contents: read


jobs:
  build:
    name: Build macOS (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Apple Silicon
            runner: macos-15
            arch: arm64
            artifact: BLACKOUT-ZERO-HOUR-macOS-arm64
          - name: Intel
            runner: macos-15-intel
            arch: x86_64
            artifact: BLACKOUT-ZERO-HOUR-macOS-x64

    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      MACOSX_DEPLOYMENT_TARGET: "12.0"

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Build standalone SDL2
        shell: bash
        run: |
          set -euo pipefail
          SDL_SOURCE="$RUNNER_TEMP/SDL2"
          SDL_PREFIX="$RUNNER_TEMP/sdl2"
          git clone --depth 1 --branch release-2.32.10 https://github.com/libsdl-org/SDL.git "$SDL_SOURCE"
          cmake -S "$SDL_SOURCE" -B "$SDL_SOURCE/build" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$SDL_PREFIX" \
            -DCMAKE_OSX_ARCHITECTURES="${{ matrix.arch }}" \
            -DCMAKE_OSX_DEPLOYMENT_TARGET="$MACOSX_DEPLOYMENT_TARGET" \
            -DSDL_SHARED=ON -DSDL_STATIC=OFF -DSDL_TEST=OFF
          cmake --build "$SDL_SOURCE/build" --config Release --parallel 3
          cmake --install "$SDL_SOURCE/build"

      - name: Verify build environment
        shell: bash
        run: |
          set -euo pipefail
          echo "Runner architecture: $(uname -m)"
          echo "Requested architecture: ${{ matrix.arch }}"
          echo "Standalone SDL2 prefix: $RUNNER_TEMP/sdl2"
          test -f macos/main3d.c
          command -v clang
          command -v cmake
          test -f "$RUNNER_TEMP/sdl2/lib/libSDL2-2.0.0.dylib"

      - name: Compile native game and create app bundle
        shell: bash
        run: |
          set -euxo pipefail

          APP="dist/BLACKOUT ZERO HOUR.app"
          APP_MACOS="$APP/Contents/MacOS"
          APP_FRAMEWORKS="$APP/Contents/Frameworks"
          SDL_PREFIX="$RUNNER_TEMP/sdl2"
          SDL_LIB="$SDL_PREFIX/lib/libSDL2-2.0.0.dylib"
          EXECUTABLE="$APP_MACOS/blackout-zero-hour"

          test -f "$SDL_LIB"
          mkdir -p "$APP_MACOS" "$APP_FRAMEWORKS"

          clang \
            -arch "${{ matrix.arch }}" \
            -mmacosx-version-min="$MACOSX_DEPLOYMENT_TARGET" \
            -O2 -Wall -Wextra \
            -I"$SDL_PREFIX/include/SDL2" \
            macos/main3d.c \
            -L"$SDL_PREFIX/lib" -lSDL2 -Wl,-rpath,@executable_path/../Frameworks \
            -framework OpenGL \
            -lm \
            -o "$EXECUTABLE"

          cp "$SDL_LIB" "$APP_FRAMEWORKS/"
          install_name_tool \
            -id "@executable_path/../Frameworks/libSDL2-2.0.0.dylib" \
            "$APP_FRAMEWORKS/libSDL2-2.0.0.dylib"

          SDL_OLD_ID="$(otool -L "$EXECUTABLE" | awk '/libSDL2-2.0.0.dylib/ { print $1; exit }')"
          test -n "$SDL_OLD_ID"
          install_name_tool \
            -change "$SDL_OLD_ID" \
            "@executable_path/../Frameworks/libSDL2-2.0.0.dylib" \
            "$EXECUTABLE"

          cat > "$APP/Contents/Info.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleExecutable</key>
            <string>blackout-zero-hour</string>
            <key>CFBundleIdentifier</key>
            <string>com.blackoutzerohour.game</string>
            <key>CFBundleName</key>
            <string>BLACKOUT ZERO HOUR</string>
            <key>CFBundleDisplayName</key>
            <string>BLACKOUT: ZERO HOUR</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>CFBundleIconFile</key>
            <string>BLACKOUT</string>
            <key>CFBundleVersion</key>
            <string>1.0.0</string>
            <key>CFBundleShortVersionString</key>
            <string>1.0.0</string>
            <key>LSMinimumSystemVersion</key>
            <string>12.0</string>
            <key>NSHighResolutionCapable</key>
            <true/>
          </dict>
          </plist>
          PLIST

          chmod +x "$EXECUTABLE"
          file "$EXECUTABLE"
          lipo "$EXECUTABLE" -verify_arch "${{ matrix.arch }}"
          lipo "$APP_FRAMEWORKS/libSDL2-2.0.0.dylib" -verify_arch "${{ matrix.arch }}"
          otool -L "$EXECUTABLE"

      - name: Create BLACKOUT app icon
        shell: bash
        run: |
          set -euo pipefail
          APP="dist/BLACKOUT ZERO HOUR.app"
          ICONSET="$RUNNER_TEMP/BLACKOUT.iconset"
          mkdir -p "$ICONSET"
          cat > "$RUNNER_TEMP/make-icon.swift" <<'SWIFT'
          import AppKit
          let size = 1024
          let image = NSImage(size: NSSize(width: size, height: size))
          image.lockFocus()
          let bounds = NSRect(x: 0, y: 0, width: size, height: size)
          let bg = NSBezierPath(roundedRect: bounds.insetBy(dx: 24, dy: 24), xRadius: 190, yRadius: 190)
          let gradient = NSGradient(colors: [NSColor(calibratedRed: 0.035, green: 0.055, blue: 0.12, alpha: 1), NSColor(calibratedRed: 0.30, green: 0.035, blue: 0.07, alpha: 1)])!
          gradient.draw(in: bg, angle: -35)
          let ring = NSBezierPath(ovalIn: NSRect(x: 170, y: 170, width: 684, height: 684))
          ring.lineWidth = 34
          NSColor(calibratedRed: 0.95, green: 0.12, blue: 0.16, alpha: 1).setStroke()
          ring.stroke()
          let bolt = NSBezierPath()
          bolt.move(to: NSPoint(x: 570, y: 835)); bolt.line(to: NSPoint(x: 350, y: 520)); bolt.line(to: NSPoint(x: 485, y: 520)); bolt.line(to: NSPoint(x: 430, y: 190)); bolt.line(to: NSPoint(x: 690, y: 555)); bolt.line(to: NSPoint(x: 545, y: 555)); bolt.close()
          NSColor.white.setFill(); bolt.fill()
          image.unlockFocus()
          let tiff = image.tiffRepresentation!
          let rep = NSBitmapImageRep(data: tiff)!
          let png = rep.representation(using: .png, properties: [:])!
          try png.write(to: URL(fileURLWithPath: CommandLine.arguments[1]))
          SWIFT
          swift "$RUNNER_TEMP/make-icon.swift" "$RUNNER_TEMP/icon-1024.png"
          for spec in "16:16" "16:32" "32:32" "32:64" "128:128" "128:256" "256:256" "256:512" "512:512" "512:1024"; do
            size="${spec%%:*}"; pixels="${spec##*:}"
            name="icon_${size}x${size}"
            [[ "$pixels" != "$((size*2))" ]] || name="${name}@2x"
            sips -z "$pixels" "$pixels" "$RUNNER_TEMP/icon-1024.png" --out "$ICONSET/$name.png" >/dev/null
          done
          iconutil -c icns "$ICONSET" -o "$APP/Contents/Resources/BLACKOUT.icns"
          plutil -lint "$APP/Contents/Info.plist"
          test -s "$APP/Contents/Resources/BLACKOUT.icns"

      - name: Create and verify drag-and-drop DMG
        shell: bash
        run: |
          set -euxo pipefail

          APP="dist/BLACKOUT ZERO HOUR.app"
          DMG_ROOT="dist/dmg-root"
          DMG_NAME="${{ matrix.artifact }}.dmg"

          mkdir -p "$DMG_ROOT"
          ditto "$APP" "$DMG_ROOT/BLACKOUT ZERO HOUR.app"
          ln -s /Applications "$DMG_ROOT/Applications"

          hdiutil create \
            -volname "BLACKOUT ZERO HOUR" \
            -srcfolder "$DMG_ROOT" \
            -ov \
            -format UDZO \
            "$DMG_NAME"

          hdiutil verify "$DMG_NAME"
          test -s "$DMG_NAME"

      - name: Upload downloadable DMG
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}-DMG
          path: ${{ matrix.artifact }}.dmg
          if-no-files-found: error
          retention-days: 30


  publish-release:
    name: Publish macOS DMGs to GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download both macOS DMGs
        uses: actions/download-artifact@v4
        with:
          pattern: "*-DMG"
          path: dist
          merge-multiple: true

      - name: Attach DMGs to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          prerelease: false
          draft: false
          files: |
            dist/*.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update GitHub README with verified downloads
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const path = 'README.md';
            const tag = 'v1.0.0';
            const { data: file } = await github.rest.repos.getContent({ owner, repo, path });
            const original = Buffer.from(file.content, 'base64').toString('utf8');
            const section = [
              '## Download for macOS',
              '',
              'Both installers below were generated and verified by the GitHub Actions release workflow. These builds are not notarized because this project does not have an Apple Developer ID.',
              '',
              '- [Apple Silicon (M1/M2/M3/M4)](https://github.com/' + owner + '/' + repo + '/releases/download/' + tag + '/BLACKOUT-ZERO-HOUR-macOS-arm64.dmg)',
              '- [Intel Mac](https://github.com/' + owner + '/' + repo + '/releases/download/' + tag + '/BLACKOUT-ZERO-HOUR-macOS-x64.dmg)',
              '',
              'First launch: macOS may say the app cannot be verified because it is not notarized. Only if you trust this build, open System Settings → Privacy & Security → Open Anyway after the first blocked launch. Do not disable Gatekeeper globally.',
              '',
              'See the [full release notes and files](https://github.com/' + owner + '/' + repo + '/releases/tag/' + tag + ').',
              ''
            ].join('\n');
            const start = '<!-- MACOS-DOWNLOADS-START -->';
            const end = '<!-- MACOS-DOWNLOADS-END -->';
            const block = start + '\n' + section + end;
            let updated;
            if (original.includes(start) && original.includes(end)) {
              updated = original.replace(new RegExp(start + '[\\s\\S]*?' + end), block);
            } else {
              updated = original.replace('## Build', block + '\n## Build');
            }
            if (updated === original) {
              core.info('README download section is already current.');
            } else {
              await github.rest.repos.createOrUpdateFileContents({
                owner, repo, path,
                message: 'Add verified macOS DMG download links',
                sha: file.sha,
                content: Buffer.from(updated).toString('base64')
              });
            }
