name: Build BLACKOUT ZERO HOUR for macOS

on:
  push:
    branches: [main]
    paths:
      - "macos/**"
      - ".github/workflows/build-mac.yml"
      - "README.md"
  workflow_dispatch:

permissions:
  contents: read


jobs:
  build:
    name: Build macOS (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Apple Silicon
            runner: macos-latest
            arch: arm64
            artifact: BLACKOUT-ZERO-HOUR-macOS-arm64
          - name: Intel
            runner: macos-15-intel
            arch: x86_64
            artifact: BLACKOUT-ZERO-HOUR-macOS-x64

    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      MACOSX_DEPLOYMENT_TARGET: "12.0"

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install SDL2
        run: brew install sdl2

      - name: Verify build environment
        shell: bash
        run: |
          set -euo pipefail
          echo "Runner architecture: $(uname -m)"
          echo "Requested architecture: ${{ matrix.arch }}"
          echo "SDL2 prefix: $(brew --prefix sdl2)"
          test -f macos/main3d.c
          command -v clang
          command -v sdl2-config

      - name: Compile native game and create app bundle
        shell: bash
        run: |
          set -euxo pipefail

          APP="dist/BLACKOUT ZERO HOUR.app"
          APP_MACOS="$APP/Contents/MacOS"
          APP_FRAMEWORKS="$APP/Contents/Frameworks"
          SDL_PREFIX="$(brew --prefix sdl2)"
          SDL_LIB="$SDL_PREFIX/lib/libSDL2-2.0.0.dylib"
          EXECUTABLE="$APP_MACOS/blackout-zero-hour"

          test -f "$SDL_LIB"
          mkdir -p "$APP_MACOS" "$APP_FRAMEWORKS"

          clang \
            -arch "${{ matrix.arch }}" \
            -mmacosx-version-min="$MACOSX_DEPLOYMENT_TARGET" \
            -O2 -Wall -Wextra \
            $(sdl2-config --cflags) \
            macos/main3d.c \
            $(sdl2-config --libs) \
            -framework OpenGL \
            -lm \
            -o "$EXECUTABLE"

          cp "$SDL_LIB" "$APP_FRAMEWORKS/"
          install_name_tool \
            -id "@executable_path/../Frameworks/libSDL2-2.0.0.dylib" \
            "$APP_FRAMEWORKS/libSDL2-2.0.0.dylib"

          SDL_OLD_ID="$(otool -L "$EXECUTABLE" | awk '/libSDL2-2.0.0.dylib/ { print $1; exit }')"
          test -n "$SDL_OLD_ID"
          install_name_tool \
            -change "$SDL_OLD_ID" \
            "@executable_path/../Frameworks/libSDL2-2.0.0.dylib" \
            "$EXECUTABLE"

          cat > "$APP/Contents/Info.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleExecutable</key>
            <string>blackout-zero-hour</string>
            <key>CFBundleIdentifier</key>
            <string>com.blackoutzerohour.game</string>
            <key>CFBundleName</key>
            <string>BLACKOUT ZERO HOUR</string>
            <key>CFBundleDisplayName</key>
            <string>BLACKOUT: ZERO HOUR</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>CFBundleVersion</key>
            <string>1.0.0</string>
            <key>CFBundleShortVersionString</key>
            <string>1.0.0</string>
            <key>LSMinimumSystemVersion</key>
            <string>12.0</string>
            <key>NSHighResolutionCapable</key>
            <true/>
          </dict>
          </plist>
          PLIST

          chmod +x "$EXECUTABLE"
          file "$EXECUTABLE"
          lipo "$EXECUTABLE" -verify_arch "${{ matrix.arch }}"
          lipo "$APP_FRAMEWORKS/libSDL2-2.0.0.dylib" -verify_arch "${{ matrix.arch }}"
          otool -L "$EXECUTABLE"

      - name: Create and verify drag-and-drop DMG
        shell: bash
        run: |
          set -euxo pipefail

          APP="dist/BLACKOUT ZERO HOUR.app"
          DMG_ROOT="dist/dmg-root"
          DMG_NAME="${{ matrix.artifact }}.dmg"

          mkdir -p "$DMG_ROOT"
          ditto "$APP" "$DMG_ROOT/BLACKOUT ZERO HOUR.app"
          ln -s /Applications "$DMG_ROOT/Applications"

          hdiutil create \
            -volname "BLACKOUT ZERO HOUR" \
            -srcfolder "$DMG_ROOT" \
            -ov \
            -format UDZO \
            "$DMG_NAME"

          hdiutil verify "$DMG_NAME"
          test -s "$DMG_NAME"

      - name: Upload downloadable DMG
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}-DMG
          path: ${{ matrix.artifact }}.dmg
          if-no-files-found: error
          retention-days: 30


  publish-release:
    name: Publish macOS DMGs to GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download both macOS DMGs
        uses: actions/download-artifact@v4
        with:
          pattern: "*-DMG"
          path: dist
          merge-multiple: true

      - name: Attach DMGs to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          prerelease: false
          draft: false
          files: |
            dist/*.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update GitHub README with verified downloads
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const path = 'README.md';
            const tag = 'v1.0.0';
            const { data: file } = await github.rest.repos.getContent({ owner, repo, path });
            const original = Buffer.from(file.content, 'base64').toString('utf8');
            const section = [
              '## Download for macOS',
              '',
              'Both installers below were generated and verified by the GitHub Actions release workflow.',
              '',
              '- [Apple Silicon (M1/M2/M3/M4)](https://github.com/' + owner + '/' + repo + '/releases/download/' + tag + '/BLACKOUT-ZERO-HOUR-macOS-arm64.dmg)',
              '- [Intel Mac](https://github.com/' + owner + '/' + repo + '/releases/download/' + tag + '/BLACKOUT-ZERO-HOUR-macOS-x64.dmg)',
              '',
              'See the [full release notes and files](https://github.com/' + owner + '/' + repo + '/releases/tag/' + tag + ').',
              ''
            ].join('\n');
            const start = '<!-- MACOS-DOWNLOADS-START -->';
            const end = '<!-- MACOS-DOWNLOADS-END -->';
            const block = start + '\n' + section + end;
            let updated;
            if (original.includes(start) && original.includes(end)) {
              updated = original.replace(new RegExp(start + '[\\s\\S]*?' + end), block);
            } else {
              updated = original.replace('## Build', block + '\n## Build');
            }
            if (updated === original) {
              core.info('README download section is already current.');
            } else {
              await github.rest.repos.createOrUpdateFileContents({
                owner, repo, path,
                message: 'Add verified macOS DMG download links',
                sha: file.sha,
                content: Buffer.from(updated).toString('base64')
              });
            }
